# Имя с пустым префиксом перед разделителем: плагин такой файл своим не считает.
# Разделитель `_` требует непустого префикса (`prod_yc_inventory.yml`), иначе
# `_yc_inventory.yml` и `myyc_inventory.yml` попадали бы к плагину по одному
# признаку «в имени есть yc_inventory».
all:
  hosts:
    underscorehost:
      ansible_host: 192.0.2.22