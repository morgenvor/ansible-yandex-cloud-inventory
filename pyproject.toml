[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-yandex-cloud-inventory-fixed"
version = "3.0.5"
description = "Ansible dynamic inventory plugin for Yandex Cloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Maksim Zatolokin", email = "max.zatol@gmail.com"}
]
maintainers = [
    {name = "morgenvor"}
]
keywords = ["ansible", "inventory", "yandex", "cloud", "dynamic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
# ansible-core, а не мета-пакет `ansible`: у `ansible` своя нумерация (3.x…14.x),
# поэтому `ansible>=2.18.6` ничего не ограничивал и заодно тянул в окружение
# весь набор коллекций (~50 МБ), который плагину не нужен. Плагин импортирует
# только ansible.plugins.inventory и ansible.errors — это ядро.
# Нижняя граница 2.18.18, а не 2.18.6: 2.18.18 — первый патч ветки с
# исправлением CVE-2026-11332. К пути плагина (inventory, без `ansible-galaxy
# role install`) уязвимость не относится, но зависимость с известной CVE в
# публичном пакете — лишний повод для замечаний сканеров.
dependencies = [
    "ansible-core>=2.18.18",
    # Верхняя граница: плагин опирается на поведение protobuf-сообщений SDK
    # (незаполненное поле приходит пустым сообщением с address == "", а не None)
    # и на page_size <= 1000. Проверено на 0.99…0.412; выход SDK в 1.x —
    # отдельная проверка стендом, а не молчаливое обновление.
    "yandexcloud>=0.99.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/morgenvor/ansible-yandex-cloud-inventory"
Documentation = "https://github.com/morgenvor/ansible-yandex-cloud-inventory#readme"
Repository = "https://github.com/morgenvor/ansible-yandex-cloud-inventory.git"
Issues = "https://github.com/morgenvor/ansible-yandex-cloud-inventory/issues"
Upstream = "https://github.com/mzatolokin/ansible-yandex-cloud-inventory"

[tool.setuptools.packages.find]
where = ["."]
include = ["inventory_plugins*"]
