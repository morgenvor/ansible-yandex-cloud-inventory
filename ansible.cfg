[defaults]
# Путь к плагину из этого репо. Ключ живёт в секции [defaults],
# а не в [inventory] (иначе путь не читается).
inventory_plugins = ./inventory_plugins

[inventory]
# yandex_cloud_inventory берёт только файлы *yc_inventory.yml,
# остальные источники обслуживают штатные плагины (yaml обязателен,
# иначе чужой static-inventory молча не парсится).
enable_plugins = yandex_cloud_inventory, yaml, ini, script, host_list
